apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: elrefugio-auth:latest
        imagePullPolicy: Never # Adjust when using a real registry
        command: ["node", "dist/services/auth/index.js"]
        env:
        - name: AUTH_PORT
          value: "5001"
        - name: DATABASE_URL
          value: "postgresql://elrefugio:password@postgres:5432/elrefugio"
        ports:
        - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
